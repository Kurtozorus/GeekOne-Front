<div class="signin-scene text-center text-white">
  <div class="home signin-scene-content">
    <h1 class="font-hero">Mon compte</h1>
  </div>
</div>
<div class="container">
  <form>
    <div class="mb-3">
      <label for="NomAccountInput" class="form-label">Nom</label>
      <input
        type="text"
        class="form-control"
        id="NomAccountInput"
        placeholder="Votre nom"
        value="John"
      />
    </div>
    <div class="mb-3">
      <label for="PrenomAccountInput" class="form-label">Prénom</label>
      <input
        type="text"
        class="form-control"
        id="PrenomAccountInput"
        placeholder="Votre prénom"
        value="Doe"
      />
    </div>
    <div class="mb-3">
      <label for="AgeAccountInput" class="form-label">Age</label>
      <input
        type="number"
        class="form-control"
        id="AgeAccountInput"
        placeholder="24 ans"
        value="24"
      />
    </div>
    <div class="text-center">
      <button type="submit"
      class="btn btn-primary mb-3"
      id="btn-modif-account"
      >
        Modifier vos informations
      </button>
      <button type="submit"
      class="btn btn-danger mb-3"
      id="btn-suppr-account">
        Supprimer mon compte
      </button>
    </div>
  </form>
  <div class="text-center pt-3 mb-3">
    <a href="/editPassword">Cliquer pour modifier votre mot de passe</a>
  </div>
</div>
